<!DOCTYPE html>
<html lang="en">

<head>
    <title>Bootstrap Style Buttons</title>
    <link href="./output.css" rel="stylesheet">
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-10 rounded-xl shadow-lg">
        <h1 class="text-3xl font-bold text-center mb-8">
            Bootstrap Style Buttons
        </h1>
        <div class="flex flex-wrap gap-3 justify-center">
            <!-- Primary -->
            <button class="bg-blue-600 text-white px-5 py-2 rounded hover:bg-blue-700">
                Primary
            </button>
            <!-- Secondary -->
            <button class="bg-gray-600 text-white px-5 py-2 rounded hover:bg-gray-700">
                Secondary
            </button>
            <!-- Success -->
            <button class="bg-green-600 text-white px-5 py-2 rounded hover:bg-green-700">
                Success
            </button>
            <!-- Danger -->
            <button class="bg-red-600 text-white px-5 py-2 rounded hover:bg-red-700">
                Danger
            </button>
            <!-- Warning -->
            <button class="bg-yellow-400 text-black px-5 py-2 rounded hover:bg-yellow-500">
                Warning
            </button>
            <!-- Info -->
            <button class="bg-cyan-500 text-white px-5 py-2 rounded hover:bg-cyan-600">
                Info
            </button>
            <!-- Dark -->
            <button class="bg-gray-900 text-white px-5 py-2 rounded hover:bg-black">
                Dark
            </button>
        </div>
    </div>
</body>

</html>
