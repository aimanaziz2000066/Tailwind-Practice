<!DOCTYPE html>
<html lang="en">

<head>
    <title>Dialog Box</title>
    <link href="./output.css" rel="stylesheet">
</head>

<body class="bg-gray-200 flex items-center justify-center min-h-screen">

    <!-- Dialog Box -->
    <div id="dialogBox" class="bg-white w-96 p-8 rounded-2xl shadow-2xl">

        <h1 class="text-3xl font-bold text-gray-800 mb-4">
            Welcome!
        </h1>

        <p class="text-gray-600 mb-6">
            This is a simple dialog box made with Tailwind CSS.
        </p>

        <div class="flex justify-end gap-3">

            <button onclick="closeDialog()" class="px-5 py-2 bg-gray-300 rounded-lg hover:bg-gray-400">
                Cancel
            </button>

            <button onclick="showMessage()" class="px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                OK
            </button>

        </div>

    </div>

    <script>
        function showMessage() {
            alert("You clicked OK!");
        }

        function closeDialog() {
            document.getElementById("dialogBox").style.display = "none";
        }
    </script>

</body>

</html>
