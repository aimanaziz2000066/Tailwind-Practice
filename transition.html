<!DOCTYPE html>
<html lang="en">

<head>
    <title>Transition in Tailwind CSS</title>
    <link href="./output.css" rel="stylesheet">
</head>

<body>
    <!-- Hover button:- -->
    <button class="bg-blue-700 p-20 m-50 text-7xl font-bold text-white rounded-4xl hover:bg-red-800">
        Login
    </button>
    <!-- Transition button:- -->
    <button class="bg-blue-700 p-20 m-50 text-7xl font-bold text-white rounded-4xl hover:bg-pink-800
    transition duration-1000">
        Submit
    </button>
    <!-- Opacity:- -->
    <button class="bg-blue-700 p-20 m-50 text-7xl font-bold text-white rounded-4xl hover:opacity-5
    transition duration-1000">
        Register
    </button>
    <!-- Rotation:- -->
    <button class="bg-blue-700 p-20 m-50 text-7xl font-bold text-white rounded-4xl hover:rotate-45
    transition duration-1000">
        Click
    </button>
    <!-- Rotation 180 py:- -->
    <button class="bg-blue-700 p-20 m-50 text-7xl font-bold text-white rounded-4xl hover:rotate-180
    transition duration-1000">
        Sign up
    </button>
    <!-- Scale:- -->
    <button class="bg-blue-700 p-20 m-50 text-7xl font-bold text-white rounded-4xl hover:scale-70
    transition duration-1000">
        Sign in
    </button>
    <!-- Scale x axis:- -->
    <button class="bg-blue-700 p-20 m-50 text-7xl font-bold text-white rounded-4xl hover:scale-x-150
    transition duration-1000">
        Get Started
    </button>
    <!-- Scale y axis:- -->
    <button class="bg-blue-700 p-20 m-50 text-7xl font-bold text-white rounded-4xl hover:scale-y-150
    transition duration-1000">
        Search
    </button>
    <!-- Transition on Images:- -->
    <img src="panda2.jfif" class="m-96 w-96 hover:rotate-180 transition duration-1000 hover:scale-150 hover:scale-x-100 hover:opacity-5"alt="">

</body>
</html>
