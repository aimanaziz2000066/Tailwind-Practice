<!DOCTYPE html>
<html lang="en">
<head>
    <title>Filters with Tailwind CSS</title>
    <link href="./output.css" rel="stylesheet">
</head>
<body>
    <h1 class="text-4xl font-bold text-center text-red-900 bg-amber-500">
    Hello Coders
</h1>
 <h1 class="text-4xl font-bold blur-sm text-center">
    Hello Coders
</h1>
    <img src="panda2.jfif"/>
    <img class="blur-sm" src="panda2.jfif"/>
    <img class="blur-md" src="panda2.jfif"/>
    <img class="blur-3xl" src="panda2.jfif"/>
    <h1 class="text-4xl font-bold text-center text-cyan-800 bg-amber-500">Brightness</h1>
    <img src="panda2.jfif"/>
    <img class="brightness-150" src="panda2.jfif"/>
    <h1 class="text-4xl font-bold text-center text-pink-800 bg-amber-500">Contrast</h1>
    <img src="panda2.jfif"/>
    <img class="contrast-200" src="panda2.jfif"/>
    <h1 class="text-4xl font-bold text-center text-black bg-amber-500">Gray Scale</h1>
    <img src="panda2.jfif"/>
    <img class="grayscale-250" src="panda2.jfif"/>
    <h1 class="text-4xl font-bold text-center text-purple-700 bg-amber-500">Invert</h1>
    <img src="panda2.jfif"/>
    <img class="invert" src="panda2.jfif"/>
    <h1 class="text-4xl font-bold text-center text-blue-500 bg-amber-500">Hue</h1>
    <img src="panda2.jfif"/>
    <img class="hue-rotate-180" src="panda2.jfif"/>
</body>
</html>
